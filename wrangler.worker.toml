# Standalone Worker + static assets. Update BACKEND_ORIGIN before deploying.
name = "app-downloader-edge"
main = "worker/index.mjs"
compatibility_date = "2026-10-22"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/api"]

[vars]
BACKEND_ORIGIN = "https://REPLACE-WITH-YOUR-RENDER-SERVICE.onrender.com"
