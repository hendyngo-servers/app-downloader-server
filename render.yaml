services:
  - type: web
    name: app-downloader-server
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: r2
      - key: DATA_FILE
        value: /tmp/app-downloader/data.json
      - key: UPLOAD_DIR
        value: /tmp/app-downloader/uploads
      - key: R2_PREFIX
        value: app-downloader-server
      - key: COOKIE_SAME_SITE
        value: lax
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: MAX_UPLOAD_MB
        value: "90"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
