# Standalone Cloudflare Worker with static assets and API proxy.
# Set BACKEND_ORIGIN in Workers & Pages > app-downloader-edge > Settings > Variables
# to the HTTPS URL of the deployed Render service, without a trailing slash.
# Example value: https://your-service.onrender.com
name = "app-downloader-edge"
main = "worker/index.mjs"
compatibility_date = "2026-10-22"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/api"]
